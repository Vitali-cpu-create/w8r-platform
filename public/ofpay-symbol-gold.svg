<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">OfPay gold symbol</title>
  <desc id="desc">A gold lowercase f nested inside a circular O.</desc>
  <defs>
    <linearGradient id="gold" x1="12" y1="8" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E7B0"/>
      <stop offset="0.48" stop-color="#D6AD48"/>
      <stop offset="1" stop-color="#9A6A13"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- The upper hook of the f joins the ring; the ring flows anti-clockwise and leaves a 20-unit gap. -->
    <path d="M79.7 20.3A42 42 0 1 0 89.9 37"/>
    <path d="M79.7 20.3c-6.8 0-11.2 0-15.1.3C48.9 21.8 40 28 40 39.2V78"/>
    <path d="M33 48h34"/>
  </g>
</svg>
